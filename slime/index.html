<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Slime Vertical</title>
<link rel="manifest" href="/slime/manifest.webmanifest">
<meta name="theme-color" content="#0b3a66">
<link rel="apple-touch-icon" href="/slime/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/slime/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slime">

<style>
  html, body { margin: 0; height: 100%; background: #0b3a66; overflow: hidden; }
  body { display: flex; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #wrap { position: relative; height: 100%; width: 100%; max-width: 62vh; overflow: hidden; background: #2aa5ff; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } #wrap { max-width: 62dvh; } }
  canvas { display: block; width: 100%; height: 100%; }
  .btn { position: absolute; bottom: 18px; width: 74px; height: 74px; border-radius: 50%;
         border: 4px solid #111; background: rgba(255,255,255,.72); color: #111; font-size: 30px; font-weight: 900;
         display: flex; align-items: center; justify-content: center; touch-action: none; padding: 0;
         box-shadow: 0 5px 0 rgba(0,0,0,.35); -webkit-tap-highlight-color: transparent; }
  .btn.on { background: #ffd43b; transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  #bl { left: 42px; } #br { left: 158px; }
  #bj { right: 16px; width: 92px; height: 92px; font-size: 17px; letter-spacing: .5px; background: rgba(255,212,59,.9); }
  #bj.on { background: #ff9f1a; }
  #panel, #shop { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,40,80,.45); }
  #panel.hide, #shop.hide { display: none; }
  #card, #scard { background: #fff; border: 5px solid #111; border-radius: 22px; padding: 22px 26px; text-align: center;
          width: min(78%, 300px); box-shadow: 0 8px 0 rgba(0,0,0,.4); color: #111; }
  #card h1, #scard h1 { margin: 0 0 8px; font-size: 30px; font-weight: 900; }
  #card p, #scard p { margin: 6px 0; font-size: 16px; line-height: 1.35; }
  #card .big { font-size: 40px; font-weight: 900; color: #0a6cff; margin: 4px 0; }
  .pbtn { margin-top: 14px; font: inherit; font-size: 20px; font-weight: 900; padding: 12px 26px; border-radius: 16px;
        border: 4px solid #111; background: #ffd43b; color: #111; box-shadow: 0 5px 0 rgba(0,0,0,.35); touch-action: manipulation; }
  .pbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .pbtn.alt { background: #fff; font-size: 17px; padding: 10px 20px; }
  .pbtn + .pbtn { margin-left: 6px; }
  #bk { right: 25px; bottom: 124px; font-size: 30px; display: none; }
  #bk.show { display: flex; }
  #bkn { position: absolute; right: -8px; top: -8px; background: #111; color: #fff; font-size: 13px; font-weight: 900;
         border-radius: 12px; min-width: 24px; height: 24px; line-height: 24px; text-align: center; }
  #scard { width: min(90%, 360px); padding: 16px 14px; max-height: 92%; overflow-y: auto; touch-action: pan-y; }
  #wallet { font-size: 20px; font-weight: 900; color: #c77700; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; text-align: left; border: 3px solid #111; border-radius: 14px;
         padding: 8px 10px; margin: 8px 0; background: #eef7ff; }
  .row .ic { font-size: 30px; width: 38px; text-align: center; flex: none; }
  .row .tx { flex: 1; min-width: 0; }
  .row .tx b { display: block; font-size: 16px; }
  .row .tx span { display: block; font-size: 12.5px; line-height: 1.25; color: #333; }
  .row .tx i { display: block; font-style: normal; font-size: 12.5px; font-weight: 800; color: #0a6cff; margin-top: 2px; }
  .buy { flex: none; font: inherit; font-size: 15px; font-weight: 900; min-width: 74px; padding: 9px 6px; border-radius: 12px;
         border: 3px solid #111; background: #ffd43b; color: #111; box-shadow: 0 4px 0 rgba(0,0,0,.35); touch-action: manipulation; }
  .buy:disabled { background: #d5d9de; color: #666; box-shadow: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button class="btn" id="bl" aria-label="Gauche">◀</button>
  <button class="btn" id="br" aria-label="Droite">▶</button>
  <button class="btn" id="bj" aria-label="Saut">SAUT</button>
  <button class="btn" id="bk" aria-label="Fusée">🚀<span id="bkn">0</span></button>
  <div id="panel"><div id="card">
    <h1 id="ptitle">Slime Vertical</h1>
    <div id="pbody"></div>
    <button id="go" class="pbtn">Jouer</button><button id="shopBtn" class="pbtn alt">Magasin</button>
  </div></div>
  <div id="shop" class="hide"><div id="scard">
    <h1>Magasin</h1>
    <p id="wallet"></p>
    <div id="items"></div>
    <button id="back" class="pbtn">Retour</button>
  </div></div>
</div>

  function resize() {
    var r = wrap.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);

  }

  // ---------- commandes ----------
  var key = { l: false, r: false, j: false }, jumpBuf = 0;
  function bind(id, name) {
    var el = document.getElementById(id);
    function down(e) { e.preventDefault(); key[name] = true; el.classList.add("on"); if (name === "j") jumpBuf = 0.12;
      try { el.setPointerCapture(e.pointerId); } catch (x) {} }
    function up(e) { e.preventDefault(); key[name] = false; el.classList.remove("on"); }
    el.addEventListener("pointerdown", down); el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up); el.addEventListener("lostpointercapture", up);
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }
  bind("bl", "l"); bind("br", "r"); bind("bj", "j");
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "q" || e.key === "a") key.l = true;
    if (e.key === "ArrowRight" || e.key === "d") key.r = true;
    if (e.key === " " || e.key === "ArrowUp" || e.key === "z" || e.key === "w") { if (!e.repeat) jumpBuf = 0.12; e.preventDefault(); }
    if (e.key === "Enter" && state !== "play") start();
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft" || e.key === "q" || e.key === "a") key.l = false;
    if (e.key === "ArrowRight" || e.key === "d") key.r = false;
  });

  // ---------- état ----------
  var state = "menu", plats, coins, p, camY, startY, best = 0, height = 0, coinCount = 0, time = 0, pops, enemies, arrows;

  var S = { coins: 0, best: 0, jump: 0, speed: 0, hearts: 0, rockets: 0, double: 0, armor: 0 };
  try {
    var raw = JSON.parse(localStorage.getItem("plushaut_save") || "null");

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function addPlat(x, y, w, withCoins) {
    var pl = { x: x, y: y, w: w };
    plats.push(pl);
    if (withCoins) {
      var n = w > 150 ? 3 : (w > 108 ? 2 : 1), step = 38, x0 = x + w / 2 - (n - 1) * step / 2;
      for (var i = 0; i < n; i++) coins.push({ x: x0 + i * step, y: y - 30, got: false, ph: Math.random() * 6 });
      // Monstres : rares, seulement après 10 m et sur les plates-formes assez larges.
      var hm = (startY - y) / M, r = Math.random(), chance = 0.14;
      if (hm > 10 && w >= 115 && r < chance)
        enemies.push({ type: r < chance * 0.55 ? "z" : "s", pl: pl, x: x + w / 2, y: y, dir: Math.random() < 0.5 ? -1 : 1, t: rnd(1.2, 2.6), dead: 0 });
    }

  }

  // Génère la plate-forme suivante : taille et écart aléatoires, mais toujours atteignable.
  function nextPlat() {
    var prev = plats[plats.length - 1];
    var h = (startY - prev.y) / M;                       // hauteur atteinte en mètres
    var hard = clamp(h / 120, 0, 1);                     // la difficulté monte doucement
    var dy = rnd(78, 118 + 32 * hard);                   // saut max 187 px : il reste de la marge
    var maxW = 190 - 55 * hard;
    var w = rnd(Math.max(84, maxW * 0.5), maxW);
    var reach = 105 + 30 * hard;                         // écart horizontal max entre les bords
    var lo = Math.max(RULER + 6, prev.x - reach - w), hi = Math.min(W - w - 6, prev.x + prev.w + reach);
    var x = rnd(lo, hi);
    addPlat(x, prev.y - dy, w, true);
  }

  function reset() {
    plats = []; coins = []; pops = []; enemies = []; arrows = [];
    startY = 0; camY = -H + 230; height = 0; coinCount = 0;
    addPlat(RULER + 20, startY, W - RULER - 40, false);  // grande plate-forme de départ
    p = { x: W / 2 + RULER / 2, y: startY, vx: 0, vy: 0, ground: true, coyote: 0, sq: 0, face: 1, inv: 0, rocket: 0 };

    panel.classList.remove("hide");

  function revive() {
    S.hearts--; save();

    }

  function hurt() {
    if (p.inv > 0 || p.rocket > 0 || state !== "play") return;
    if (S.armor > 0) { S.armor--; p.inv = 1.5; pops.push({ x: p.x, y: p.y - 70, t: 0, txt: "Armure brisée !" }); save(); }
    else if (S.hearts > 0) { S.hearts--; p.inv = 1.6; pops.push({ x: p.x, y: p.y - 70, t: 0, txt: "Cœur utilisé !" }); save(); }
    else gameOver();
  }

  // Fusée : propulse d'environ 20 m et aspire les pièces sur le passage.
  function useRocket() {
    if (state !== "play" || S.rockets <= 0 || p.rocket > 0) return;
    S.rockets--; save(); p.rocket = 1.2; p.ground = false; updateButtons();
  }
  bk.addEventListener("pointerdown", function (e) { e.preventDefault(); useRocket(); });
  bk.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("keydown", function (e) { if (e.key === "f" || e.key === "Shift") useRocket(); });

  // ---------- magasin ----------
  var ITEMS = [
    { id: "hearts", ic: "❤️", name: "Cœur", desc: "Une vie en plus : te sauve d'une chute ou d'un coup de monstre.", stock: 3, prices: [20] },
    { id: "armor", ic: "🛡️", name: "Armure", desc: "Bloque un coup d'épée ou une flèche, puis se brise.", stock: 3, prices: [25] },
    { id: "rockets", ic: "🚀", name: "Fusée", desc: "Te propulse de 20 m. Bouton fusée pendant la partie.", stock: 3, prices: [30] },
    { id: "jump", ic: "⬆️", name: "Saut plus grand", desc: "Chaque achat te fait sauter plus haut, pour toujours.", levels: 8, base: 30,
      fx: function (n) { return "saut +" + Math.round((Math.pow(1 + 0.08 * n, 2) - 1) * 100) + " %"; } },
    { id: "speed", ic: "⚡", name: "Vitesse plus rapide", desc: "Chaque achat te fait aller plus vite, pour toujours.", levels: 8, base: 20,
      fx: function (n) { return "vitesse +" + Math.round(0.12 * n * 100) + " %"; } },
    { id: "double", ic: "💰", name: "Pièces x2", desc: "Chaque pièce ramassée compte double, pour toujours.", levels: 1, base: 100,
      fx: function () { return "activé"; } }
  ];
  function priceOf(it, n) { return it.stock ? it.prices[0] : it.base * (n + 1); }   // chaque niveau coûte plus cher
  function renderShop() {
    $("wallet").textContent = "Tes pièces : " + S.coins;
    var h = "";
    for (var i = 0; i < ITEMS.length; i++) {
      var it = ITEMS[i], n = S[it.id], max = it.stock || it.levels, full = n >= max;
      var price = priceOf(it, n);
      var st = it.stock ? "En stock : " + n + " / " + max : "Niveau " + n + " / " + max + (n ? " · " + it.fx(n) : "");
      if (it.levels === 1) st = n ? "Activé" : "Pas encore acheté";
      h += '<div class="row"><div class="ic">' + it.ic + '</div><div class="tx"><b>' + it.name + '</b><span>' + it.desc + '</span><i>' + st + '</i></div>' +
        '<button class="buy" data-i="' + i + '"' + (full || S.coins < price ? " disabled" : "") + '>' + (full ? "Max" : price + " 🪙") + '</button></div>';
    }
    $("items").innerHTML = h;
  }
  $("items").addEventListener("click", function (e) {
    var bt = e.target.closest ? e.target.closest(".buy") : null; if (!bt || bt.disabled) return;
    var it = ITEMS[+bt.getAttribute("data-i")], n = S[it.id], max = it.stock || it.levels;
    var price = priceOf(it, n);
    if (n >= max || S.coins < price) return;
    S.coins -= price; S[it.id] = n + 1; save(); renderShop();
  });
  $("shopBtn").addEventListener("click", function () { renderShop(); panel.classList.add("hide"); shop.classList.remove("hide"); });
  $("back").addEventListener("click", function () {
    shop.classList.add("hide"); panel.classList.remove("hide");
    if (state === "menu") pbody.innerHTML = intro + stats();
    else { var ps = pbody.querySelectorAll("p"); if (ps.length) ps[ps.length - 1].innerHTML = "Pièces : <b>" + S.coins + "</b>"; }
  });
  var intro = "<p>Grimpe le plus haut possible et ramasse les pièces.</p><p>◀ ▶ pour bouger, SAUT pour sauter.</p><p>Saute sur les monstres pour les écraser.</p>";
  pbody.innerHTML = intro + stats();

  // ---------- logique ----------
  function update(dt) {
    time += dt;
    if (state !== "play") return;
    var dir = (key.r ? 1 : 0) - (key.l ? 1 : 0);
    if (dir) p.face = dir;
    var target = dir * SPEED * (1 + 0.12 * S.speed), acc = p.ground ? 2600 : 1700;
    if (p.vx < target) p.vx = Math.min(target, p.vx + acc * dt); else if (p.vx > target) p.vx = Math.max(target, p.vx - acc * dt);

    jumpBuf -= dt; p.coyote -= dt;
    if (jumpBuf > 0 && (p.ground || p.coyote > 0)) { p.vy = -JUMP * (1 + 0.08 * S.jump); p.ground = false; p.coyote = 0; jumpBuf = 0; p.sq = -0.22; }

    var prevY = p.y;
    if (p.rocket > 0) { p.rocket -= dt; p.vy = -1000; } else { p.vy += G * dt; if (p.vy > 1400) p.vy = 1400; }
    if (p.inv > 0) p.inv -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.x = clamp(p.x, RULER + PW / 2 - 6, W - PW / 2 + 6);  // murs sur les côtés

    var wasGround = p.ground; p.ground = false;
    if (p.vy >= 0) {
      for (var i = 0; i < plats.length; i++) {
        var pl = plats[i];
        if (prevY <= pl.y + 0.5 && p.y >= pl.y && p.x > pl.x - PW * 0.2 && p.x < pl.x + pl.w + PW * 0.2) {
          p.y = pl.y; if (!wasGround && p.vy > 300) p.sq = 0.25; p.vy = 0; p.ground = true; break;
        }
      }
    }
    if (wasGround && !p.ground && p.vy >= 0) p.coyote = 0.09;
    p.sq *= Math.pow(0.0006, dt);

    for (var c = 0; c < coins.length; c++) {
      var co = coins[c];
      if (!co.got && Math.abs(co.x - p.x) < (p.rocket > 0 ? 95 : 34) && Math.abs(co.y - (p.y - PH / 2)) < (p.rocket > 0 ? 85 : 38)) {
        var gain = S.double ? 2 : 1; co.got = true; coinCount += gain; S.coins += gain; pops.push({ x: co.x, y: co.y, t: 0, g: gain });
      }
    }
    for (var k = pops.length - 1; k >= 0; k--) { pops[k].t += dt; if (pops[k].t > (pops[k].txt ? 1.2 : 0.5)) pops.splice(k, 1); }

    // ---- monstres ----
    for (var ei = enemies.length - 1; ei >= 0; ei--) {
      var en = enemies[ei];
      if (en.dead) { en.dead += dt; if (en.dead > 0.45) enemies.splice(ei, 1); continue; }
      var onScreen = en.y - camY > -40 && en.y - camY < H + 40;
      if (en.type === "z") {                               // zombie : fait des allers-retours avec son épée
        en.x += en.dir * 46 * dt;
        if (en.x < en.pl.x + 20) { en.x = en.pl.x + 20; en.dir = 1; }
        if (en.x > en.pl.x + en.pl.w - 20) { en.x = en.pl.x + en.pl.w - 20; en.dir = -1; }
      } else {                                             // squelette : vise le joueur et tire une flèche
        en.dir = p.x < en.x ? -1 : 1;
        if (onScreen && Math.abs(p.x - en.x) > 50) { en.t -= dt; if (en.t <= 0) { en.t = 2.8; arrows.push({ x: en.x + en.dir * (SK.hx - SK.ax) * SKW, y: en.y - SK.hy * SKH + 6, vx: en.dir * 250 }); } }
      }
      var eh = en.type === "s" ? 82 : 62;
      if (Math.abs(p.x - en.x) < 38 && p.y > en.y - eh && p.y - PH < en.y) {
        if (p.vy > 100 && prevY <= en.y - eh * 0.5) {             // on lui tombe dessus : écrasé
          en.dead = 0.001; p.vy = -560; p.ground = false; var eg = S.double ? 6 : 3;
          coinCount += eg; S.coins += eg; pops.push({ x: en.x, y: en.y - 50, t: 0, g: eg });
        } else hurt();
      }
    }
    for (var ai = arrows.length - 1; ai >= 0; ai--) {
      var ar = arrows[ai]; ar.x += ar.vx * dt;
      if (ar.x < RULER - 20 || ar.x > W + 20 || ar.y - camY > H + 50) { arrows.splice(ai, 1); continue; }
      if (Math.abs(ar.x - p.x) < 28 && ar.y > p.y - PH && ar.y < p.y) { arrows.splice(ai, 1); hurt(); if (state !== "play") return; }
    }
    if (state !== "play") return;

    height = Math.max(height, (startY - p.y) / M);
    var want = p.y - H * 0.52;                            // la caméra monte, ne redescend jamais
    if (want < camY) camY += (want - camY) * Math.min(1, dt * 9);

    while (plats[plats.length - 1].y > camY - 300) nextPlat();
    while (plats.length && plats[0].y > camY + H + 200) plats.shift();
    while (coins.length && coins[0].y > camY + H + 200) coins.shift();
    while (enemies.length && enemies[0].y > camY + H + 200) enemies.shift();

    if (p.y - PH > camY + H + 30) { if (S.hearts > 0) revive(); else gameOver(); }             // sorti de l'écran par le bas
  }

  // ---------- dessin ----------
  function drawSky() {
    var im = IMG.sky;
    if (!im.complete || !im.naturalWidth) { ctx.fillStyle = "#2aa5ff"; ctx.fillRect(0, 0, W, H); return; }
    var th = W * im.naturalHeight / im.naturalWidth, top = camY * 0.3;
    for (var i = Math.floor(top / th); i * th < top + H; i++) {
      var y = i * th - top;
      ctx.drawImage(im, 0, y, W, th + 1);
    }
  }

  function drawPlat(pl) {
    var im = IMG.pf, y = pl.y - camY - PLAT_H * GRASS;
    if (!im.complete || !im.naturalWidth) { ctx.fillStyle = "#4bbf1f"; ctx.fillRect(pl.x, pl.y - camY, pl.w, 20); return; }
    var sw = im.naturalWidth, sh = im.naturalHeight, capS = sw * 0.2, cap = Math.min(capS * PLAT_H / sh, pl.w / 2);
    var x = pl.x - 6, w = pl.w + 12;                      // le dessin déborde un peu de la zone d'appui
    ctx.drawImage(im, 0, 0, capS, sh, x, y, cap, PLAT_H);
    ctx.drawImage(im, capS, 0, sw - 2 * capS, sh, x + cap - 0.5, y, w - 2 * cap + 1, PLAT_H);
    ctx.drawImage(im, sw - capS, 0, capS, sh, x + w - cap, y, cap, PLAT_H);
  }

  function drawCoin(x, y, ph) {
    var s = Math.cos(time * 4 + ph), ax = Math.max(0.12, Math.abs(s)), bob = Math.sin(time * 3 + ph) * 2.5, r = 13;
    ctx.save(); ctx.translate(x, y + bob); ctx.scale(ax, 1);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fillStyle = "#ffc400"; ctx.fill();
    ctx.save(); ctx.clip();                                // ombre cel shading en bas à droite
    ctx.beginPath(); ctx.arc(-5, -6, r + 3, 0, 6.2832); ctx.rect(-r * 2, -r * 2, r * 4, r * 4); ctx.fillStyle = "#f08c00"; ctx.fill("evenodd");
    ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, r - 4.5, 0, 6.2832); ctx.lineWidth = 2; ctx.strokeStyle = "#b35c00"; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-5, -6, 4, 2.2, -0.7, 0, 6.2832); ctx.fillStyle = "#fff"; ctx.fill();   // reflet
    ctx.restore();
    ctx.save(); ctx.translate(x, y + bob); ctx.scale(ax, 1);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = "#111"; ctx.stroke();                                            // contour encre
  }

  function drawPlayer() {
    var im = IMG.ch, stretch = clamp(-p.vy / 2600, -0.12, 0.2) - p.sq;
    var sx = 1 - stretch * 0.7, sy = 1 + stretch;
    if (p.rocket > 0) {                                    // flammes de la fusée
      var f = 30 + Math.random() * 18;
      ctx.save(); ctx.translate(p.x, p.y - camY - 4);
      ctx.beginPath(); ctx.moveTo(-18, 0); ctx.quadraticCurveTo(-10, f * 0.6, 0, f); ctx.quadraticCurveTo(10, f * 0.6, 18, 0); ctx.closePath();
      ctx.fillStyle = "#ff7a00"; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = "#111"; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-9, 0); ctx.quadraticCurveTo(-5, f * 0.35, 0, f * 0.6); ctx.quadraticCurveTo(5, f * 0.35, 9, 0); ctx.closePath();
      ctx.fillStyle = "#ffe066"; ctx.fill(); ctx.restore();
    }
    if (p.inv > 0 && Math.floor(time * 12) % 2) ctx.globalAlpha = 0.3;
    ctx.save(); ctx.translate(p.x, p.y - camY + 3); ctx.scale(sx * p.face, sy);
    // katana dans le dos : dessiné avant le corps pour passer derrière lui
    ctx.save(); ctx.translate(-40, -2); ctx.rotate(Math.atan2(-64, 80));
    rr(0, -4, 70, 8, 3.5); ink("#1c2340");                                         // fourreau
    rr(0, -4, 9, 8, 3); ink("#f2b632", 2);                                         // embout doré
    rr(70, -3.5, 33, 7, 2.5); ink("#d63a3a");                                      // poignée
    ctx.beginPath(); for (var kx = 76; kx < 100; kx += 7) { ctx.moveTo(kx, -3.5); ctx.lineTo(kx + 4, 0); ctx.lineTo(kx, 3.5); }
    ctx.lineWidth = 1.6; ctx.strokeStyle = "#111"; ctx.stroke();                   // tressage
    ctx.beginPath(); ctx.ellipse(69, 0, 3, 9, 0, 0, 6.2832); ink("#f2b632", 2.2);  // garde
    ctx.beginPath(); ctx.arc(103, 0, 3.6, 0, 6.2832); ink("#f2b632", 2);           // pommeau
    ctx.restore();
    if (im.complete && im.naturalWidth) ctx.drawImage(im, -PW / 2, -PH, PW, PH);
    else { ctx.fillStyle = "#0a84ff"; ctx.beginPath(); ctx.ellipse(0, -PH / 2, PW / 2, PH / 2, 0, 0, 6.2832); ctx.fill(); }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }
  function ink(fill, lw) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw || 2.5; ctx.strokeStyle = "#111"; ctx.lineJoin = "round"; ctx.stroke(); }

  // Remplissage cel shading : couleur, ombre nette sous la ligne sy, puis contour encre.
  function cel(path, fill, dark, sy, lw) {

    ctx.restore();
    path(); ctx.lineWidth = lw || 3; ctx.strokeStyle = "#111"; ctx.lineJoin = "round"; ctx.stroke();
  }
  function shine(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 6.2832); ctx.fillStyle = "#fff"; ctx.fill(); }

  function drawZombie(e) {                                 // proportions chibi : grosse tête, petit corps

    cel(function () { rr(-21, -66, 42, 38, 14); }, "#a6e85e", "#72bd3a", -40);                              // tête
    cel(function () { ctx.beginPath(); ctx.moveTo(-17, -60); ctx.lineTo(-13, -74); ctx.lineTo(-7, -65); ctx.lineTo(-2, -76); ctx.lineTo(3, -65);
      ctx.lineTo(10, -72); ctx.lineTo(13, -62); ctx.quadraticCurveTo(0, -68, -17, -60); ctx.closePath(); }, "#4f8a2a", "#3b6b1e", -66, 2.5);   // mèches
    shine(-12, -58, 5, 2.4, -0.5);

    shine(7.5, -47.5, 2, 2, 0); shine(11.5, -41.5, 1, 1, 0);
    ctx.beginPath(); ctx.moveTo(0, -57); ctx.lineTo(17, -52); ctx.lineWidth = 3; ctx.strokeStyle = "#111"; ctx.stroke();   // sourcil fâché
    // œil fermé en croix
    ctx.beginPath(); ctx.moveTo(-14, -45); ctx.lineTo(-5, -39); ctx.moveTo(-5, -45); ctx.lineTo(-14, -39); ctx.lineWidth = 2.6; ctx.stroke();

    ctx.save(); ctx.translate(10, -24); ctx.rotate(-0.5 + swing);                                            // bras + épée
    cel(function () { rr(0, -4, 16, 8, 4); }, "#a6e85e", "#72bd3a", 1, 2.5);

    rr(-2, -8.5, 4.5, 17, 2); ink("#f2b632"); rr(-10, -2.8, 9, 5.6, 2); ink("#8a5220");

  function drawSkeleton(e) {
    var im = IMG.sk;
    if (!im.complete || !im.naturalWidth) { drawSkeletonVec(e); return; }
    var pull = e.t < 0.7 ? (0.7 - e.t) / 0.7 : 0;
    ctx.save(); ctx.scale(1 + Math.sin(time * 3) * 0.012, 1 - Math.sin(time * 3) * 0.012 + pull * 0.03);   // respiration, se tend avant le tir
    ctx.drawImage(im, -SK.ax * SKW, -SKH + 4, SKW, SKH);
    ctx.restore();
    if (pull > 0) drawArrowShape((SK.hx - SK.ax) * SKW - 16, -SK.hy * SKH + 4, 1);                         // flèche encochée
  }

  function drawSkeletonVec(e) {
    var pull = e.t < 0.7 ? (0.7 - e.t) / 0.7 : 0, idle = Math.sin(time * 4) * 1.2;       // il bande l'arc avant de tirer
    ctx.lineCap = "round";
    function bone(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineWidth = 8.5; ctx.strokeStyle = "#111"; ctx.stroke(); ctx.lineWidth = 4; ctx.strokeStyle = "#fbf8ee"; ctx.stroke(); }
    bone(-5, -12, -7, -2); bone(5, -12, 7, -2);                                                              // jambes
    ctx.save(); ctx.translate(0, idle);
    cel(function () { rr(-10, -27, 20, 16, 5); }, "#fbf8ee", "#cfc8b2", -17);                                // cage thoracique
    ctx.beginPath(); for (var k = 0; k < 3; k++) { ctx.moveTo(-6, -23 + k * 4.2); ctx.lineTo(6, -23 + k * 4.2); } ctx.moveTo(0, -26); ctx.lineTo(0, -12);
    ctx.lineWidth = 1.8; ctx.strokeStyle = "#111"; ctx.stroke();
    cel(function () { ctx.beginPath(); ctx.moveTo(-9, -29); ctx.lineTo(9, -29); ctx.lineTo(7, -24); ctx.lineTo(-22 - idle, -17); ctx.lineTo(-16, -23); ctx.lineTo(-24, -26 + idle); ctx.closePath(); },
      "#e8413c", "#b02a2a", -23, 2.5);                                                                       // écharpe rouge au vent
    cel(function () { rr(-9, -40, 18, 11, 3.5); }, "#fbf8ee", "#cfc8b2", -33, 2.5);                          // mâchoire
    ctx.beginPath(); for (var d = -5; d <= 5; d += 3.4) { ctx.moveTo(d, -38); ctx.lineTo(d, -31); } ctx.lineWidth = 1.6; ctx.stroke();
    cel(function () { ctx.beginPath(); ctx.ellipse(0, -53, 20, 17.5, 0, 0, 6.2832); }, "#fbf8ee", "#cfc8b2", -44);   // gros crâne
    shine(-10, -62, 5.5, 2.6, -0.5);
    // grandes orbites manga, inclinées pour l'air méchant, avec pupilles rouges brillantes
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.ellipse(-6, -51, 5.2, 7, 0.25, 0, 6.2832); ctx.fill(); ctx.beginPath(); ctx.ellipse(9, -51, 5.2, 7, -0.25, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#ff3b30"; ctx.beginPath(); ctx.arc(-5, -50, 2.6, 0, 6.2832); ctx.fill(); ctx.beginPath(); ctx.arc(10, -50, 2.6, 0, 6.2832); ctx.fill();
    shine(-6, -51.2, 1, 1, 0); shine(9, -51.2, 1, 1, 0);
    ctx.beginPath(); ctx.moveTo(1, -44); ctx.lineTo(-0.5, -41); ctx.lineTo(2.5, -41); ctx.closePath(); ctx.fillStyle = "#111"; ctx.fill();   // nez
    ctx.beginPath(); ctx.moveTo(12, -66); ctx.lineTo(9, -61); ctx.lineTo(13, -59); ctx.lineWidth = 1.6; ctx.strokeStyle = "#111"; ctx.stroke();   // fêlure
    bone(8, -22, 20, -24);                                                                                   // bras
    ctx.beginPath(); ctx.arc(10, -24, 20, -1.05, 1.05); ctx.lineWidth = 7.5; ctx.strokeStyle = "#111"; ctx.stroke(); ctx.lineWidth = 3.5; ctx.strokeStyle = "#b9722e"; ctx.stroke();   // arc
    var sx = 20 - pull * 12, ty = 17.3;
    ctx.beginPath(); ctx.moveTo(20, -24 - ty); ctx.lineTo(sx, -24); ctx.lineTo(20, -24 + ty); ctx.lineWidth = 1.5; ctx.strokeStyle = "#111"; ctx.stroke();                              // corde
    if (pull > 0) drawArrowShape(sx + 12, -24, 1);
    ctx.restore();
    ctx.lineCap = "butt";
  }

  function drawArrowShape(x, y, dir) {
    ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(10, 0); ctx.lineWidth = 5; ctx.strokeStyle = "#111"; ctx.stroke(); ctx.lineWidth = 2.5; ctx.strokeStyle = "#c98a3c"; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(8, -5); ctx.lineTo(8, 5); ctx.closePath(); ink("#dfe7f2", 2);
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-19, -5); ctx.lineTo(-12, -5); ctx.lineTo(-8, 0); ctx.lineTo(-12, 5); ctx.lineTo(-19, 5); ctx.closePath(); ink("#ff5a5a", 1.8);
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y - camY + 2);
    if (e.dead) { ctx.globalAlpha = Math.max(0, 1 - e.dead / 0.45); ctx.scale(1 + e.dead * 1.2, Math.max(0.15, 1 - e.dead * 3)); }
    ctx.scale(e.dir, 1);
    if (e.type === "z") drawZombie(e); else drawSkeleton(e);
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawShield(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y - s); ctx.lineTo(x + s, y + s * 0.1);
    ctx.quadraticCurveTo(x + s, y + s, x, y + s * 1.25); ctx.quadraticCurveTo(x - s, y + s, x - s, y + s * 0.1); ctx.closePath();
    ink("#9fb4cc", 2.5);
    ctx.beginPath(); ctx.moveTo(x, y - s * 0.6); ctx.lineTo(x, y + s * 0.75); ctx.moveTo(x - s * 0.55, y - s * 0.1); ctx.lineTo(x + s * 0.55, y - s * 0.1); ctx.lineWidth = 2; ctx.stroke();
  }

  function drawHeart(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
    ctx.bezierCurveTo(x - s * 1.7, y - s * 0.2, x - s * 0.7, y - s * 1.4, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.7, y - s * 1.4, x + s * 1.7, y - s * 0.2, x, y + s * 0.9);
    ctx.fillStyle = "#ff3b4e"; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = "#111"; ctx.stroke();
  }

  function outlined(txt, x, y, size, align, fill) {
    ctx.font = "900 " + size + "px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
    ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = "#111"; ctx.strokeText(txt, x, y);
    ctx.fillStyle = fill || "#fff"; ctx.fillText(txt, x, y);
  }

  function drawRuler() {
    ctx.fillStyle = "rgba(255,255,255,.82)"; ctx.fillRect(0, 0, RULER, H);
    ctx.fillStyle = "#111"; ctx.fillRect(RULER - 3, 0, 3, H);
    var mTop = Math.ceil((startY - camY) / M), mBot = Math.max(0, Math.floor((startY - camY - H) / M));
    ctx.font = "800 11px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    for (var m = mBot; m <= mTop; m++) {
      var y = startY - m * M - camY, major = m % 5 === 0;
      ctx.fillStyle = "#111"; ctx.fillRect(RULER - 3 - (major ? 16 : 8), y - (major ? 1.5 : 1), major ? 16 : 8, major ? 3 : 2);
      ctx.fillRect(RULER - 3 - 5, y - M / 2 - 0.5, 5, 1);                                   // demi-mètre
      if (major) ctx.fillText(String(m), 3, y - 9);
    }
    // repère de la hauteur du joueur
    var py = p.y - camY - PH / 2;
    ctx.beginPath(); ctx.moveTo(RULER + 9, py); ctx.lineTo(RULER - 4, py - 8); ctx.lineTo(RULER - 4, py + 8); ctx.closePath();
    ctx.fillStyle = "#ff3b30"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#111"; ctx.stroke();
    // trait du record
    if (best > 0) {
      var by = startY - best * M - camY;
      if (by > -20 && by < H + 20) {
        ctx.setLineDash([8, 6]); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(17,17,17,.6)";
        ctx.beginPath(); ctx.moveTo(RULER, by); ctx.lineTo(W, by); ctx.stroke(); ctx.setLineDash([]);
        outlined("RECORD", W - 8, by - 11, 12, "right", "#ffd43b");
      }
    }
  }

  function draw() {
    drawSky();
    if (!plats) return;
    var i;
    for (i = 0; i < plats.length; i++) if (plats[i].y - camY > -80 && plats[i].y - camY < H + 80) drawPlat(plats[i]);
    for (i = 0; i < coins.length; i++) { var c = coins[i]; if (!c.got && c.y - camY > -30 && c.y - camY < H + 30) drawCoin(c.x, c.y - camY, c.ph); }
    for (i = 0; i < enemies.length; i++) if (enemies[i].y - camY > -70 && enemies[i].y - camY < H + 70) drawEnemy(enemies[i]);
    for (i = 0; i < arrows.length; i++) drawArrowShape(arrows[i].x, arrows[i].y - camY, arrows[i].vx > 0 ? 1 : -1);
    for (i = 0; i < pops.length; i++) { var o = pops[i]; ctx.globalAlpha = Math.max(0, 1 - o.t / (o.txt ? 1.2 : 0.5)); outlined(o.txt || "+" + (o.g || 1), o.x, o.y - camY - o.t * 70, 18, "center", o.txt ? "#ff8fa0" : "#ffd43b"); ctx.globalAlpha = 1; }
    drawPlayer();
    drawRuler();
    outlined(height.toFixed(1) + " m", RULER + 12, 28, 26, "left", "#fff");
    outlined("Record " + Math.max(best, height).toFixed(1) + " m", RULER + 12, 56, 15, "left", "#ffd43b");
    outlined(String(S.coins), W - 10, 29, 24, "right", "#ffd43b");
    drawCoin(W - 10 - ctx.measureText(String(S.coins)).width - 20, 28, 0);
    for (var hh = 0; hh < S.hearts; hh++) drawHeart(W - 22 - hh * 28, 62, 10);
    for (var aa = 0; aa < S.armor; aa++) drawShield(W - 22 - aa * 28, 90, 9);
  }

  reset();
  var last = 0;
  function frame(t) {
    var dt = Math.min(0.033, (t - last) / 1000 || 0); last = t;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/slime/sw.js',{scope:'/slime/'}).catch(()=>{}));</script>
